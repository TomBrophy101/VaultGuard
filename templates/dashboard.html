<!DOCTYPE html><html><head><meta charset="UTF-8"><title>VaultGuard - Dashboard</title></head><body><h2>Welcome, {{ username }} | <a href="/logout">Logout</a></h2><div id="dom-banner" style="background:#eef;padding:8px;margin-bottom:12px;"></div><script>if(window.location.hash){const msg=decodeURIComponent(window.location.hash.substring(1));document.getElementById("dom-banner").innerHTML="Status: "+msg;}</script><h3>Search Vault</h3><form method="GET" action="/dashboard"><input type="text" name="q" placeholder="Search title..." value="{{ search_query }}"><button type="submit">Search</button></form>{% if search_query %}<p>Showing results for: <strong>{{ search_query | safe }}</strong></p>{% endif %}<h3>Add New Credential / Secret</h3><form method="POST" action="/dashboard"><input type="text" name="title" placeholder="Entry Title" required><br><br><input type="text" name="secret_data" placeholder="Secret Token" required><br><br><button type="submit">Save to Vault</button></form><h3>Your Saved Items</h3><table border="1" cellpadding="6"><tr><th>ID</th><th>Title</th><th>Secret Data</th></tr>{% for item in items %}<tr><td>{{ item[0] }}</td><td>{{ item[1] | safe }}</td><td>{{ item[2] | safe }}</td></tr>{% endfor %}</table></body></html>
